<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Source for letterhead-header.png: the page-1 letterhead block used in the Apple Pages version.
     6.5in wide = the letter's text width. Rendered by render-header.js. -->
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; }
  .block { width: 6.5in; height: 0.98in; position: relative; background: #fff; }
  .logo { position: absolute; left: 0; bottom: 0.17in; width: 2.7in; }
  .contact { position: absolute; left: 4.05in; bottom: 0.17in; font-family: "Libre Baskerville", Georgia, serif;
             font-size: 8pt; line-height: 1.55; color: #1d2a30; }
  .contact .name { font-weight: 700; color: #163a47; }
  .rule { position: absolute; left: 0; right: 0; bottom: 0.02in; height: 0.75pt; background: #b08d57; }
</style>
</head>
<body>
  <div class="block">
    <img class="logo" src="../../images/logo.png" alt="">
    <div class="contact">
      <div class="name">Katy Thomack, RN, MSN, CLNC</div>
      <div>720-254-1359</div>
      <div>katy@thomacklnc.com</div>
      <div>thomacklnc.com</div>
    </div>
    <div class="rule"></div>
  </div>
</body>
</html>
